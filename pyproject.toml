[project]
name = "wne-uw-ml1-qf-labs-materials"
version = "0.1.0"
description = "Lab notebooks for the Machine Learning in Finance I (2400-QFU1MLF) course at WNE UW"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scikit-optimize>=0.10.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "nbqa>=1.9.1",
    "nbstripout>=0.8.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501"]
